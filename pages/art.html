<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Art</title>
    <link rel="stylesheet" href="../styles/styles.css">
    <script src="../scripts/scripts.js" defer></script>
    <script src="../scripts/art-script.js" defer></script>
</head>
<body>
    <header>
        <div id="navbar"></div>
    </header>
    <div class="full-img" id="fullImgBox">
        <img src = "../images/test-image.jpg" id="fullImg">
        <span onclick="closeFullImg()">X</span>
    </div>
    <main>
        <h1>Art</h1>
        <div class="arts-container">

            <div class="art-card" onclick="goToArtPage('digital-art')">
                <img class="art-card-image" src="../images/art/digital-art/mako.png">
                <h2 class="art-title">digital art</h2>
            </div>

            <div class="art-card" onclick="goToArtPage('traditional-art')">
                <img class="art-card-image" src="../images/art/traditional-art/Dramatugry.jpg">
                <h2 class="art-title">traditional art</h2>
            </div>

            <div class="art-card" onclick="goToArtPage('pyrography')">
                <img class="art-card-image" src="../images/art/pyography/collection.jpg">
                <h2 class="art-title">pyography</h2>
            </div>

        </div>
    </main>
</body>
</html>
